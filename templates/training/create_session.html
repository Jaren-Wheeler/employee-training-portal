{% extends "training/base.html" %} {% block content %}

<h2 class="mb-4">Schedule New Session</h2>

<div class="card p-4 shadow-sm">
  {% if messages %} {% for message in messages %}
  <div class="alert alert-info py-2">{{ message }}</div>
  {% endfor %} {% endif %}

  <form method="post">
    {% csrf_token %}

    <!-- Course -->
    <div class="mb-3">
      <label for="course" class="form-label">Course</label>
      <select id="course" name="course" class="form-select" required>
        {% for course in courses %}
        <option
          value="{{ course.id }}"
          {%
          if
          session
          and
          course.id=""
          ="session.course.id"
          %}selected{%
          endif
          %}
        >
          {{ course.title }}
        </option>
        {% endfor %}
      </select>
    </div>

    <!-- Date -->
    <div class="mb-3">
      <label for="session_date" class="form-label">Date</label>
      <input
        id="session_date"
        type="date"
        name="session_date"
        class="form-control"
        value="{{ session.session_date|default:'' }}"
        required
      />
    </div>

    <!-- Instructor -->
    <div class="mb-3">
      <label class="form-label">Instructor</label>
      <input
        type="text"
        name="instructor_name"
        class="form-control"
        value="{{ session.instructor_name|default:'' }}"
        placeholder="Enter instructor name"
        required
      />
    </div>

    <!-- Mode -->
    <div class="mb-3">
      <label for="mode" class="form-label">Mode</label>
      <select id="mode" name="mode" class="form-select" required>
        <option
          value="ONLINE"
          {%
          if
          session
          and
          session.mode=""
          ="ONLINE"
          %}selected{%
          endif
          %}
        >
          Online
        </option>
        <option
          value="IN_PERSON"
          {%
          if
          session
          and
          session.mode=""
          ="IN_PERSON"
          %}selected{%
          endif
          %}
        >
          In-Person
        </option>
      </select>
    </div>

    <!-- Buttons -->
    <div class="d-flex justify-content-end gap-2 mt-3">
      <a
        href="{% url 'training:sessions_list' %}"
        class="btn btn-outline-secondary"
      >
        Cancel
      </a>

      <button type="submit" class="btn btn-primary">Save Session</button>
    </div>
  </form>
</div>

{% endblock %}
