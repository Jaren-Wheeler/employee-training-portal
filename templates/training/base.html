<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Employee Training Portal</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>

  <body>
    <div class="container mt-4">
      <!-- HEADER + NAV (can be overridden) -->
      {% block header %}
      <h1 class="text-center mb-4">Employee Training Portal</h1>

      <div class="border-bottom pb-3 mb-4">
        <nav class="d-flex justify-content-center gap-2 flex-wrap">
          <a href="{% url 'training:home' %}"
   class="btn btn-sm {% if request.resolver_match.url_name == 'home' %}btn-primary{% else %}btn-outline-primary{% endif %}">
  Home
</a>

<a href="{% url 'training:employees_list' %}"
   class="btn btn-sm {% if request.resolver_match.url_name == 'employees_list' %}btn-primary{% else %}btn-outline-primary{% endif %}">
  Employees
</a>

<a href="{% url 'training:courses_list' %}"
   class="btn btn-sm {% if request.resolver_match.url_name == 'courses_list' %}btn-primary{% else %}btn-outline-primary{% endif %}">
  Courses
</a>

<a href="#"
   class="btn btn-sm {% if request.resolver_match.url_name == 'sessions_list' %}btn-primary{% else %}btn-outline-primary{% endif %}">
  Sessions
</a>

<a href="{% url 'training:enrollment_list' %}"
   class="btn btn-sm {% if request.resolver_match.url_name == 'enrollment_list' %}btn-primary{% else %}btn-outline-primary{% endif %}">
  Enrollments
</a>

<a href="{% url 'training:analytics' %}"
   class="btn btn-sm {% if request.resolver_match.url_name == 'analytics' %}btn-primary{% else %}btn-outline-primary{% endif %}">
  Analytics
</a>
        </nav>
      </div>
      {% endblock %}

      <!-- PAGE CONTENT -->
      {% block content %}{% endblock %}
    </div>
  </body>
</html>
