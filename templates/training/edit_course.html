{% extends "training/base.html" %}

{% block content %}

<h2 class="mb-4">Edit Course</h2>

<div class="card p-4 shadow-sm">

  <form method="POST">
    {% csrf_token %}

    <!-- Title -->
    <div class="mb-3">
      <label for="title" class="form-label">Course Title</label>
      <input
        type="text"
        name="title"
        id="title"
        class="form-control"
        value="{{ course.title }}"
        required
      />
    </div>

    <!-- Category -->
    <div class="mb-3">
      <label for="category" class="form-label">Category</label>
      <select name="category" id="category" class="form-select" required>
        <option value="TECHNICAL" {% if course.category == "TECHNICAL" %}selected{% endif %}>
          Technical
        </option>
        <option value="SECURITY" {% if course.category == "SECURITY" %}selected{% endif %}>
          Security
        </option>
        <option value="SOFT_SKILLS" {% if course.category == "SOFT_SKILLS" %}selected{% endif %}>
          Soft Skills
        </option>
      </select>
    </div>

    <!-- Duration -->
    <div class="mb-3">
      <label for="duration" class="form-label">Duration (minutes)</label>
      <input
        type="number"
        name="duration"
        id="duration"
        class="form-control"
        value="{{ course.duration_minutes }}"
        min="1"
        required
      />
    </div>

    <!-- Buttons -->
    <div class="d-flex justify-content-end gap-2 mt-3">
      <a href="{% url 'training:courses_list' %}" class="btn btn-outline-secondary">
        Cancel
      </a>

      <button class="btn btn-primary" type="submit">
        Save Changes
      </button>
    </div>

  </form>

</div>

{% endblock %}
