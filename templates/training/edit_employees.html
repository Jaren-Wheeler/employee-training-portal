{% extends "training/base.html" %}

{% block content %}

<h2 class="mb-4">Edit Employee</h2>

<div class="card p-4 shadow-sm">

  <form method="POST">
    {% csrf_token %}

    <!-- Full Name -->
    <div class="mb-3">
      <label for="full_name" class="form-label">Full Name</label>
      <input
        type="text"
        name="full_name"
        id="full_name"
        class="form-control"
        value="{{ employee.full_name }}"
        required
      />
    </div>

    <!-- Email -->
    <div class="mb-3">
      <label for="email" class="form-label">Email</label>
      <input
        type="email"
        name="email"
        id="email"
        class="form-control"
        value="{{ employee.email }}"
        required
      />
    </div>

    <!-- Department -->
    <div class="mb-3">
      <label for="department" class="form-label">Department</label>
      <select name="department" id="department" class="form-select" required>
        <option value="IT" {% if employee.department == "IT" %}selected{% endif %}>
          IT
        </option>
        <option value="SALES" {% if employee.department == "SALES" %}selected{% endif %}>
          Sales
        </option>
        <option value="HR" {% if employee.department == "HR" %}selected{% endif %}>
          HR
        </option>
      </select>
    </div>

    <!-- Buttons -->
    <div class="d-flex justify-content-end gap-2 mt-3">
      <a href="{% url 'training:employees_list' %}" class="btn btn-outline-secondary">
        Cancel
      </a>

      <button class="btn btn-primary" type="submit">
        Save Changes
      </button>
    </div>

  </form>

</div>

{% endblock %}
